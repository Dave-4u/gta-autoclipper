quality_policy_version: 2
active_niche: gta6
search:
  keywords: []
  results_per_keyword: 8
  keywords_per_run: 5
  max_source_duration: 240
  min_source_duration: 15
  sort_by: recent_views
  max_age_days: 45
  use_trending: true
download:
  links_file: links.txt
  output_dir: downloads
  # Optional: bypass YouTube bot check. Example: chrome  or  edge
  cookies_from_browser: ''
  # Netscape cookies.txt from Firefox export (also used for search):
  cookies: 'C:/Users/DAVE.A/Downloads/cookies.txt'
  timeout_seconds: 120
  format: bv*[height<=1080][vcodec!~='av01'][vcodec!~='av1']+ba/b[height<=1080]/b
history:
  file: history.json
clips:
  width: 1080
  height: 1920
  min_duration: 8
  max_duration: 18
  target_duration: 15
  max_clips_per_video: 3
  loudness_lufs: -14
  hook_duration: 2.0
  font: ''
  output_dir: outputs
  burn_captions: true
  copyright_safe:
    enabled: true
    max_source_seconds: 18
    speed: 1.05
    zoom: 1.08
    commentary_layer: true
analysis:
  weights:
    loudness: 1.0
    scene_change: 1.2
    motion: 0.8
    keyword: 1.5
  transcript_boost_words:
  - crazy
  - insane
  - wait
  - look
  - oh my god
  use_whisper: true
  whisper_model: tiny
  max_analyze_seconds: 90
  whisper_for_highlights: false
  scene_threshold: 27.0
  vocal_prefilter: true
scheduler:
  default_hours: 6
autopilot:
  niches:
  - anime
  - animation
  - gta6
  clips_per_niche: 2
  max_videos: 2
  interval_hours: 0
hashtags:
- '#Shorts'
- '#FYP'
- '#Viral'
hooks:
  use_ollama: true
  ollama_host: http://127.0.0.1:11434
  ollama_model: llama3.2
  ollama_timeout: 8
  pool_size: 16
voiceover:
  enabled: true
  speed: 0.98
  intro_header: true
  intro_seconds: 1.8
  engine: auto
  voice: am_fenrir
  fallback_voice: en_US-lessac-high
  edge_voice: en-US-AndrewMultilingualNeural
  allow_edge_fallback: true
  volume: 1.0
  duck_level: 0.22
  sidechain: true
  models_dir: models/piper
  script_style: auto

gemini:
  api_key: ''
  model: gemini-flash-lite-latest


ranking:
  timeout_seconds: 1500
  min_items_on_timeout: 3
  min_parts: 3            # render Top N with N>=3 if some parts fail
  spare_items: 2          # extra candidates to try when a part fails
  assemble_reserve_seconds: 150
  final_review: false     # per-part Gemini video review (slow on free tier)
  review_soft: true       # keep parts on Gemini review error / score>=6
  review_soft_min: 6.0
  max_probe: 7
  workers: 2
  download_seconds: 60
  download_timeout: 180
  analyze_seconds: 75
  keywords: 6                 # search queries per ranking (pass 1)
  results_per_keyword: 25     # ytsearch25 per query
  max_source_duration: 2400   # only a short section is downloaded
  seen_fallback_min: 12       # top up with already-seen videos if fewer fresh
  ignore_seen: false
  second_pass: true           # wider search if too few usable candidates
  second_pass_results: 40
  second_pass_keywords: 8
  second_pass_max_duration: 7200
  use_trending: false
  search_timeout_seconds: 45

# Handle watermark burned on every output (ranking: once on the final video)
watermark:
  enabled: true
  text: '@officialdevclips'
  position: drift          # drift (centred, mid-lower, slow slide) | center-low | top-center | top-left | top-right
  opacity: 0.45
  size: 0.024              # fraction of video height

# Legacy montage settings retained for reference; coherent scenes disable distant stitching.
montage:
  enabled: false
  total_seconds: [45, 75]          # normal clips
  segments: [4, 7]
  ranking_total_seconds: [18, 26]  # each ranking part
  ranking_min_seconds: 18           # hard floor — never ship a 6s stub
  min_seconds: 30                   # hard floor for normal clips
  ranking_segments: [2, 4]
  segment_seconds: [5, 12]
  audio_fade_seconds: 0.15
  transition_seconds: 0.3          # xfade + audio crossfade (whip/zoom/flash/fade mix)
  min_gap_seconds: 2.0             # spread moments apart
  skip_intro_frac: 0.06            # long sources: skip OP / intro
  skip_outro_frac: 0.08            # and ED / end card
  speed_range: [1.03, 1.08]        # pitch-preserving (atempo)
  mirror: false                    # hflip alternate segments; off = safe for on-screen text

# Cutroom UI job runner (jobs run as a separate process)
job:
  watchdog_minutes: 5
  overall_timeout_seconds: 5400   # 90 min — slow CPUs need this
  autopilot_timeout_seconds: 5400
  watchdog_minutes: 8

# Slow-CPU profile (auto-on when os.cpu_count()<=8 or a quick encode bench is slow).
# Force with GTA_LOW_CPU=1 / performance.low_cpu: true. Force off with GTA_LOW_CPU=0.
performance:
  low_cpu: auto              # auto | true | false
  auto_cpu_count: 8
  preset: veryfast           # ultrafast looked trashy; veryfast still fast on slow CPUs
  crf: 20
  maxrate: 3500k              # floor so dark/anime motion isn't crushed
  bufsize: 7000k
  width: 720                 # render 720x1280 on low_cpu (still 9:16 full-screen)
  height: 1280
  whisper_model: tiny        # faster-whisper tiny int8
  skip_vocals: true          # skip vocals-separation ffmpeg pass
  skip_final_whisper_if_captions: true
  skip_final_review: true    # skip Gemini video final-gate (slow + flaky on free tier)
  threads: "0"               # 0 = ffmpeg auto
  overall_timeout_seconds: 5400   # 90 min hard job budget
  ranking_timeout_seconds: 5400
  watchdog_minutes: 8

# Shared runtime policy (also applied to older config files without rewriting credentials).
source_policy:
  mode: episode_or_local
  authorized_channels: []  # explicit exact YouTube channel IDs or @handles you may use
selection:
  mode: coherent_scene
  max_analyze_seconds: 90
framing:
  mode: adaptive
  blur_width: 180
  blur_sigma: 5
