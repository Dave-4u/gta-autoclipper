# GTA AutoClipper — tuned for GTA 6 Shorts/TikTok clipping (free, self-hosted)
# Edit keywords, durations, and paths to taste.

search:
  # yt-dlp search queries. Prefer recent + high-view GTA 6 / GTA RP content.
  keywords:
    - "GTA 6 trailer"
    - "GTA VI trailer reaction"
    - "GTA 6 news"
    - "GTA 6 leaks"
    - "GTA 6 gameplay"
    - "GTA 6 streamer reaction"
    - "GTA RP funny moments"
    - "GTA 5 RP highlights shorts"
    - "GTA VI rockstar"
  results_per_keyword: 8
  max_source_duration: 900
  min_source_duration: 15
  sort_by: recent_views
  max_age_days: 90

download:
  links_file: links.txt
  output_dir: downloads
  format: "bv*[height<=1080][vcodec!~='av01'][vcodec!~='av1']+ba/b[height<=1080]/b"

history:
  file: history.json

clips:
  width: 1080
  height: 1920
  # Copyright-safer defaults: short source windows (see copyright_safe)
  min_duration: 8
  max_duration: 18
  target_duration: 15
  max_clips_per_video: 3
  loudness_lufs: -14
  hook_duration: 2.0
  font: ""
  output_dir: outputs
  # Transformative / shorter cuts to reduce Content ID length-limit blocks
  copyright_safe:
    enabled: true
    max_source_seconds: 18
    speed: 1.05
    zoom: 1.08
    commentary_layer: true

analysis:
  weights:
    loudness: 1.0
    scene_change: 1.2
    motion: 0.8
    keyword: 1.5
  transcript_boost_words:
    - gta 6
    - gta vi
    - trailer
    - leak
    - rockstar
    - lucia
    - leonida
    - vice city
    - reaction
    - oh my god
    - crazy
    - insane
    - wait
    - look
    - police
    - chase
    - crash
    - fail
    - funny
  use_whisper: true
  whisper_model: base  # use 'tiny' for faster/low-RAM
  scene_threshold: 27.0
  vocal_prefilter: true

scheduler:
  default_hours: 6

hashtags:
  - "#GTA6"
  - "#GTAVI"
  - "#GTA"
  - "#GTA6Trailer"
  - "#GTARp"
  - "#Gaming"
  - "#GamingClips"
  - "#Shorts"
  - "#TikTok"
  - "#FYP"
  - "#Viral"
  - "#RockstarGames"
  - "#GTA6News"

hooks:
  # Optional local Ollama for smarter headers (free). Falls back to rules if offline.
  use_ollama: true
  ollama_host: "http://127.0.0.1:11434"
  ollama_model: "llama3.2"
  ollama_timeout: 8

# Free local AI voiceover (Piper TTS on CPU). Optional edge-tts online fallback.
voiceover:
  enabled: true
  engine: piper          # piper | edge-tts | auto
  voice: en_US-ryan-high # Piper voice (auto-downloads on first run)
  fallback_voice: en_US-lessac-high
  edge_voice: en-US-GuyNeural
  allow_edge_fallback: true
  volume: 1.0
  duck_level: 0.22       # bed volume when sidechain=false
  sidechain: true        # duck original under VO via ffmpeg sidechaincompress
  models_dir: models/piper
  script_style: auto     # auto | hype | commentary | reaction | news
