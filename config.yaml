active_niche: gta6
search:
  keywords: []
  results_per_keyword: 8
  keywords_per_run: 5
  max_source_duration: 240
  min_source_duration: 15
  sort_by: recent_views
  max_age_days: 45
  use_trending: true
download:
  links_file: links.txt
  output_dir: downloads
  # Optional: bypass YouTube bot check. Example: chrome  or  edge
  cookies_from_browser: ''
  # Netscape cookies.txt from Firefox export (also used for search):
  cookies: 'C:/Users/DAVE.A/Downloads/cookies.txt'
  timeout_seconds: 120
  format: bv*[height<=1080][vcodec!~='av01'][vcodec!~='av1']+ba/b[height<=1080]/b
history:
  file: history.json
clips:
  width: 1080
  height: 1920
  min_duration: 8
  max_duration: 18
  target_duration: 15
  max_clips_per_video: 3
  loudness_lufs: -14
  hook_duration: 2.0
  font: ''
  output_dir: outputs
  burn_captions: true
  copyright_safe:
    enabled: true
    max_source_seconds: 18
    speed: 1.05
    zoom: 1.08
    commentary_layer: true
analysis:
  weights:
    loudness: 1.0
    scene_change: 1.2
    motion: 0.8
    keyword: 1.5
  transcript_boost_words:
  - crazy
  - insane
  - wait
  - look
  - oh my god
  use_whisper: true
  whisper_model: tiny
  max_analyze_seconds: 90
  whisper_for_highlights: false
  scene_threshold: 27.0
  vocal_prefilter: true
scheduler:
  default_hours: 6
autopilot:
  niches:
  - anime
  - animation
  - gta6
  clips_per_niche: 2
  max_videos: 2
  interval_hours: 0
hashtags:
- '#Shorts'
- '#FYP'
- '#Viral'
hooks:
  use_ollama: true
  ollama_host: http://127.0.0.1:11434
  ollama_model: llama3.2
  ollama_timeout: 8
  pool_size: 16
voiceover:
  enabled: true
  speed: 0.98
  intro_header: true
  intro_seconds: 1.8
  engine: auto
  voice: am_fenrir
  fallback_voice: en_US-lessac-high
  edge_voice: en-US-AndrewMultilingualNeural
  allow_edge_fallback: true
  volume: 1.0
  duck_level: 0.22
  sidechain: true
  models_dir: models/piper
  script_style: auto

gemini:
  api_key: ''
  model: gemini-flash-lite-latest


ranking:
  timeout_seconds: 1500
  min_items_on_timeout: 3
  max_probe: 7
  workers: 2
  download_seconds: 60
  download_timeout: 180
  analyze_seconds: 75
  keywords: 3
  results_per_keyword: 5
  use_trending: false
  search_timeout_seconds: 30
