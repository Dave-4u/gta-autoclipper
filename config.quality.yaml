active_niche: gta6
search:
  keywords: []
  results_per_keyword: 8
  keywords_per_run: 5
  max_source_duration: 900
  min_source_duration: 15
  sort_by: recent_views
  max_age_days: 180
  use_trending: true
download:
  links_file: links.txt
  output_dir: downloads
  format: bv*[height<=1080][vcodec!~='av01'][vcodec!~='av1']+ba/b[height<=1080]/b
history:
  file: history.json
clips:
  width: 1080
  height: 1920
  min_duration: 12
  max_duration: 30
  target_duration: 22
  max_clips_per_video: 1
  loudness_lufs: -14
  hook_duration: 2.0
  font: ''
  output_dir: outputs
  burn_captions: true
  mask_profanity: true
  copyright_safe:
    enabled: true
    max_source_seconds: 18
    speed: 1.05
    zoom: 1.08
    commentary_layer: true
analysis:
  weights:
    loudness: 1.1
    scene_change: 1.2
    motion: 0.9
    keyword: 1.5
    laughter: 1.6
    scream: 1.8
    face_motion: 1.7
  transcript_boost_words:
  - crazy
  - insane
  - wait
  - look
  - oh my god
  use_whisper: true
  whisper_model: small
  scene_threshold: 27.0
  vocal_prefilter: true
scheduler:
  default_hours: 6
autopilot:
  niches:
  - gta6
  - anime
  clips_per_niche: 2
  max_videos: 2
  interval_hours: 0
hashtags:
- '#Shorts'
- '#FYP'
- '#Viral'
hooks:
  use_ollama: false
  ollama_host: http://127.0.0.1:11434
  ollama_model: llama3.2
  ollama_timeout: 8
  pool_size: 24
voiceover:
  enabled: true
  intro_header: true
  intro_seconds: 1.8
  engine: auto
  voice: am_fenrir
  fallback_voice: en_US-lessac-high
  edge_voice: en-US-AndrewMultilingualNeural
  allow_edge_fallback: true
  volume: 1.0
  duck_level: 0.22
  sidechain: true
  models_dir: models/piper
  script_style: auto

gemini:
  api_key: ''
  model: gemini-flash-lite-latest
